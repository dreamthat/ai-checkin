[package]
name = "wb-switch-server"
version = "0.1.50"
edition = "2021"
description = "wb-switch HTTP server + CLI（npm 安装形态：wb-switch 命令启动本地 webui）"

[[bin]]
name = "wb-switch"
path = "src/main.rs"

[dependencies]
wb-switch-core = { path = "../wb-switch-core" }
trae-core = { path = "../trae-core" }
credit-core = { path = "../credit-core" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde_json = "1"
serde = "1"
rust-embed = "8"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "deflate"] }
# credit 平台 next-run 时刻格式化为 RFC3339(工作区内已有同版本)
chrono = "0.4"
