[package]
name = "trae-core"
version = "0.1.0"
edition = "2021"
description = "TRAE 签到/多开核心逻辑（自 trae-mate 平移），不依赖 Tauri，可被桌面端与 HTTP server 复用"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
aes = "0.8"
cbc = "0.1"
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
rsa = "0.9"
rand = "0.8"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "deflate"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
# 与 wb-switch-core 统一 windows crate 版本，避免依赖图两份 windows。
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.52"
